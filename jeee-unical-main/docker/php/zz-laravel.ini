; Overrides applied on top of php.ini-production.
; Upload limits mirror the previous cPanel host (210M / 230M); memory is raised
; from the old 32M because Laravel + Backpack + Intervention Image need more.
memory_limit = 256M
upload_max_filesize = 210M
post_max_size = 230M
max_execution_time = 300
max_input_time = 300
expose_php = Off
display_errors = Off
log_errors = On
date.timezone = Africa/Lagos
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
