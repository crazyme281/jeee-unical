<VirtualHost *:${PORT}>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # FollowSymLinks is required for public/storage -> storage/app/public
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Never execute PHP from upload locations (user-supplied files live here).
    # Downloads go through Laravel (response()->download), not through this URL.
    <LocationMatch "^/(storage|uploads)/.*\.(php[0-9]?|phtml|phar)$">
        Require all denied
    </LocationMatch>

    # Defence in depth: never serve dotfiles such as .htaccess / .env / .git.
    <FilesMatch "^\.(ht|env|git|DS_Store)">
        Require all denied
    </FilesMatch>

    # Apache -> stdout/stderr so logs appear in the Render dashboard.
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
